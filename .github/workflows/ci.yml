name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Least privilege: CI only reads the repository. Nothing here publishes, so no
# write scopes and no persisted credentials are needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 (build, test, package)
    # win32-x64 is the only supported target and the PTY prebuild must be
    # staged on the matching host, so packaging cannot move to Linux.
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Package (win32-x64)
        run: npm run package -- --target win32-x64

      - name: Verify VSIX contents
        run: node scripts/verify-vsix.mjs --target win32-x64

      - uses: actions/upload-artifact@v4
        with:
          name: termmoor-vsix
          path: termmoor-*.vsix
          if-no-files-found: error
          retention-days: 14
